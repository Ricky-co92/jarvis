<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#05141c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="J.A.R.V.I.S.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>J.A.R.V.I.S.</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ font-size:17px; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:radial-gradient(ellipse at center, #05141c 0%, #010508 75%);
    color:#8fe8ff;font-family:'Share Tech Mono',monospace;
    min-height:100vh; min-height:100dvh;
    font-size:1rem; overflow-x:hidden;
  }
  .orb{font-family:'Orbitron',sans-serif;}
  .hidden{display:none !important;}
  a{color:inherit;text-decoration:none;}
  @keyframes spinCW{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  @keyframes spinCCW{from{transform:rotate(360deg)}to{transform:rotate(0)}}
  @keyframes pulseCore{0%,100%{opacity:.8}50%{opacity:1}}
  @keyframes dotGlow{0%,100%{opacity:.4}50%{opacity:1}}

  /* ============ CORE (animazione condivisa login + home) ============ */
  .core-anim{position:relative;}
  .core-anim svg{width:100%;height:100%;overflow:visible;display:block;}
  .spin-1{animation:spinCW 160s linear infinite;transform-origin:210px 210px;}
  .spin-2{animation:spinCCW 70s linear infinite;transform-origin:210px 210px;}
  .spin-3{animation:spinCW 45s linear infinite;transform-origin:210px 210px;}
  .pulse{animation:pulseCore 3.6s ease-in-out infinite;}
  .dot{animation:dotGlow 2.4s ease-in-out infinite;}

  /* ============ LOGIN ============ */
  #screen-login{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;}
  #login{max-width:440px;width:100%;text-align:center;}
  #login .core-anim{width:min(52vw,260px);height:min(52vw,260px);aspect-ratio:1/1;margin:0 auto 24px;}
  #login h1{font-family:'Orbitron',sans-serif;font-size:1.7rem;letter-spacing:6px;color:#e8fbff;text-transform:uppercase;}
  #login .sub{font-size:0.95rem;letter-spacing:2px;color:#4a90a8;margin-top:8px;text-transform:uppercase;}
  .field{margin-top:22px;text-align:left;}
  .field label{display:block;font-size:0.8rem;letter-spacing:2px;color:#4a90a8;margin-bottom:6px;text-transform:uppercase;}
  .field input,.field select{width:100%;background:transparent;border:none;border-bottom:1px solid rgba(42,184,217,.4);
    color:#e8fbff;padding:10px 4px;font-family:'Share Tech Mono',monospace;font-size:1.05rem;outline:none;}
  .field input:focus{border-bottom-color:#8fe8ff;}
  .btn{margin-top:26px;width:100%;padding:14px;background:transparent;border:1px solid #2ab8d9;color:#8fe8ff;
    font-family:'Orbitron',sans-serif;font-size:0.95rem;letter-spacing:4px;text-transform:uppercase;cursor:pointer;}
  .btn:hover{background:rgba(42,184,217,.12);box-shadow:0 0 16px rgba(42,184,217,.4);}
  .btn.small{width:auto;padding:10px 18px;font-size:0.85rem;letter-spacing:2px;margin-top:0;}
  .btn.ghost{border-color:rgba(42,184,217,.3);color:#4a90a8;}
  #login-error{margin-top:14px;font-size:0.85rem;color:#ff6767;min-height:16px;}

  /* ============ APP SHELL (full-width) ============ */
  #app{width:100%;min-height:100vh;min-height:100dvh;padding:22px clamp(20px,4vw,60px);display:flex;flex-direction:column;}
  .topbar{display:flex;align-items:center;gap:20px;padding-bottom:16px;margin-bottom:20px;border-bottom:1px solid rgba(42,184,217,.25);}
  .topbar .orb{font-size:1.1rem;letter-spacing:5px;color:#8fe8ff;}
  .topbar .right{margin-left:auto;display:flex;align-items:center;gap:18px;font-size:0.85rem;color:#4a90a8;}
  .topbar .right span.email{color:#8fe8ff;}
  .logout{cursor:pointer;letter-spacing:1px;}
  .logout:hover{color:#ff6767;}

  .hamburger{width:40px;height:40px;border:1px solid rgba(42,184,217,.4);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;cursor:pointer;background:transparent;flex-shrink:0;}
  .hamburger span{width:18px;height:2px;background:#8fe8ff;transition:transform .3s, opacity .3s;}
  .hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg);}
  .hamburger.open span:nth-child(2){opacity:0;}
  .hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}

  /* ============ SIDEBAR OVERLAY ============ */
  .backdrop{position:fixed;inset:0;background:rgba(1,5,8,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .3s;}
  .backdrop.open{opacity:1;pointer-events:auto;}
  #sidebar{
    position:fixed;top:0;left:0;height:100%;width:260px;background:#05141c;
    border-right:1px solid rgba(42,184,217,.35);z-index:41;padding:90px 0 20px;
    transform:translateX(-100%);transition:transform .4s cubic-bezier(.2,.8,.2,1);overflow:hidden;
  }
  #sidebar.open{transform:translateX(0);}
  .scanline{position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#8fe8ff,transparent);opacity:0;pointer-events:none;}
  #sidebar.open .scanline{animation:scandown .6s ease-out;}
  @keyframes scandown{0%{top:0;opacity:1}90%{opacity:1}100%{top:100%;opacity:0}}
  .nav-item{padding:14px 28px;font-size:0.95rem;letter-spacing:2px;color:#4a90a8;text-transform:uppercase;cursor:pointer;position:relative;opacity:0;transform:translateX(-14px);}
  #sidebar.open .nav-item{animation:itemIn .4s ease forwards;}
  #sidebar.open .nav-item:nth-child(2){animation-delay:.15s;}
  #sidebar.open .nav-item:nth-child(3){animation-delay:.28s;}
  #sidebar.open .nav-item:nth-child(4){animation-delay:.41s;}
  @keyframes itemIn{to{opacity:1;transform:translateX(0);}}
  .nav-item.active{color:#8fe8ff;}
  .nav-item.active::before{content:'';position:absolute;left:12px;top:50%;transform:translateY(-50%);width:5px;height:5px;border-radius:50%;background:#8fe8ff;box-shadow:0 0 6px #8fe8ff;}

  /* ============ HOME ============ */
  #view-home{flex:1;display:grid;grid-template-columns:1fr minmax(300px,460px) 1fr;align-items:center;gap:20px;min-height:calc(100vh - 120px);min-height:calc(100dvh - 120px);}
  .side-widget{border:1px solid rgba(42,184,217,.25);padding:20px;position:relative;justify-self:start;}
  .side-widget.right{justify-self:end;}
  .side-widget::before,.side-widget::after{content:'';position:absolute;width:12px;height:12px;border:1px solid #2ab8d9;}
  .side-widget::before{top:-1px;left:-1px;border-right:none;border-bottom:none;}
  .side-widget::after{bottom:-1px;right:-1px;border-left:none;border-top:none;}
  .datetime .time{font-family:'Orbitron',sans-serif;font-size:2.2rem;color:#e8fbff;letter-spacing:2px;line-height:1;}
  .datetime .date{font-size:0.8rem;letter-spacing:2px;color:#4a90a8;text-transform:uppercase;margin-top:8px;}
  .weather{display:flex;align-items:center;gap:16px;}
  .weather .icon{width:42px;height:42px;flex-shrink:0;}
  .weather .temp{font-family:'Orbitron',sans-serif;font-size:1.7rem;color:#e8fbff;}
  .weather .cond{font-size:0.78rem;letter-spacing:1px;color:#4a90a8;text-transform:uppercase;margin-top:4px;}
  .weather .loc{font-size:0.68rem;letter-spacing:2px;color:#3a7a92;text-transform:uppercase;margin-top:2px;}
  .center-col{display:flex;flex-direction:column;align-items:center;}
  .center-col .core-anim{width:min(30vw,320px);height:min(30vw,320px);aspect-ratio:1/1;}
  .welcome{margin-top:24px;font-size:1rem;letter-spacing:3px;color:#4a90a8;text-transform:uppercase;}

  #view-contratti{flex:1;display:flex;flex-direction:column;}

  /* panels */
  .panel{border:1px solid rgba(42,184,217,.25);padding:28px;position:relative;margin-bottom:20px;flex:1;display:flex;flex-direction:column;}
  .panel::before,.panel::after{content:'';position:absolute;width:14px;height:14px;border:1px solid #2ab8d9;}
  .panel::before{top:-1px;left:-1px;border-right:none;border-bottom:none;}
  .panel::after{bottom:-1px;right:-1px;border-left:none;border-top:none;}
  .panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:12px;}
  .panel .title{font-size:1rem;letter-spacing:3px;color:#2ab8d9;text-transform:uppercase;}
  .panel-actions{display:flex;gap:10px;flex-wrap:wrap;}

  table{width:100%;border-collapse:collapse;font-size:0.95rem;}
  th{text-align:left;font-size:0.75rem;letter-spacing:1px;color:#4a90a8;text-transform:uppercase;padding-bottom:10px;border-bottom:1px solid rgba(42,184,217,.2);}
  td{padding:13px 8px;color:#c9f2ff;border-bottom:1px solid rgba(42,184,217,.08);cursor:pointer;}
  tr:hover td{background:rgba(42,184,217,.05);}
  #contratti-table-wrap{overflow-x:auto;}
  #contratti-empty{padding:30px 0;font-size:1rem;color:#4a90a8;text-align:center;}

  /* mobile */
  @media (max-width: 900px){
    #view-home{grid-template-columns:1fr;grid-template-rows:auto auto 1fr;min-height:auto;gap:16px;}
    .side-widget,.side-widget.right{justify-self:stretch;}
    .center-col{order:3;padding:20px 0;}
  }
  @media (max-width: 760px){
    :root{ font-size:16px; }
    #app{padding:16px;}
    .topbar .orb{font-size:0.95rem;letter-spacing:3px;}
    .panel{padding:16px;}
    th:nth-child(n+4), td:nth-child(n+4){display:none;} /* mostra solo prime 3 colonne su mobile */
  }

  /* modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(1,5,8,.85);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;}
  .modal{max-width:540px;width:100%;max-height:88vh;overflow-y:auto;background:#05141c;border:1px solid rgba(42,184,217,.4);padding:26px;position:relative;}
  .modal .title{font-size:1rem;letter-spacing:3px;color:#2ab8d9;text-transform:uppercase;margin-bottom:20px;}
  .modal-close{position:absolute;top:18px;right:20px;cursor:pointer;color:#4a90a8;font-size:1.3rem;padding:4px 8px;}
  .modal-close:hover{color:#ff6767;}
  .modal-actions{display:flex;justify-content:space-between;margin-top:24px;gap:10px;}
  .campo-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;padding:10px;border:1px solid rgba(42,184,217,.15);flex-wrap:wrap;}
  .campo-row input[type=text]{flex:1;min-width:120px;background:transparent;border:none;border-bottom:1px solid rgba(42,184,217,.3);color:#e8fbff;padding:6px;font-family:'Share Tech Mono',monospace;font-size:0.95rem;outline:none;}
  .campo-row select{background:#05141c;border:1px solid rgba(42,184,217,.3);color:#e8fbff;font-size:0.85rem;padding:6px;}
  .campo-row label.chk{font-size:0.8rem;color:#4a90a8;display:flex;align-items:center;gap:4px;white-space:nowrap;}
  .campo-del{cursor:pointer;color:#ff6767;font-size:1.1rem;padding:4px 8px;}
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="screen-login">
  <div id="login">
    <div class="core-anim" id="core-login"></div>
    <h1>J.A.R.V.I.S.</h1>
    <div class="sub">Sistema personale</div>
    <form id="login-form" autocomplete="on">
      <div class="field"><label>Identificativo</label><input type="email" id="login-email" name="username" autocomplete="username" required></div>
      <div class="field"><label>Chiave di accesso</label><input type="password" id="login-password" name="password" autocomplete="current-password" required></div>
      <button class="btn" type="submit" id="btn-login">Autentica</button>
      <div id="login-error"></div>
    </form>
  </div>
</div>

<!-- ===== SIDEBAR OVERLAY ===== -->
<div class="backdrop" id="backdrop"></div>
<div id="sidebar">
  <div class="scanline"></div>
  <div class="nav-item active" data-view="home" data-text="Home">Home</div>
  <div class="nav-item" data-view="contratti" data-text="Contratti telefonici">Contratti telefonici</div>
</div>

<!-- ===== APP ===== -->
<div id="app" class="hidden">
  <div class="topbar">
    <button class="hamburger" id="btn-hamburger"><span></span><span></span><span></span></button>
    <div class="orb" id="topbar-title">J.A.R.V.I.S.</div>
    <div class="right">
      <span class="email" id="user-email"></span>
      <span class="logout" id="btn-logout">Esci</span>
    </div>
  </div>

  <!-- HOME -->
  <div id="view-home">
    <div class="side-widget datetime">
      <div class="time" id="clock">--:--:--</div>
      <div class="date" id="dateStr">—</div>
    </div>

    <div class="center-col">
      <div class="core-anim" id="core-home"></div>
      <div class="welcome" id="welcome-text">bentornato</div>
    </div>

    <div class="side-widget weather right">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#8fe8ff" stroke-width="1.4">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/>
        <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/>
      </svg>
      <div>
        <div class="temp" id="weather-temp">—</div>
        <div class="cond" id="weather-cond">Meteo non disponibile</div>
        <div class="loc" id="weather-loc"></div>
      </div>
    </div>
  </div>

  <!-- CONTRATTI -->
  <div id="view-contratti" class="hidden">
    <div class="panel">
      <div class="panel-head">
        <div class="title">◈ contratti telefonici</div>
        <div class="panel-actions">
          <button class="btn small ghost" id="btn-gestisci-campi">Gestisci campi</button>
          <button class="btn small" id="btn-nuovo-contratto">+ Nuovo contratto</button>
        </div>
      </div>
      <div id="contratti-table-wrap">
        <table id="contratti-table">
          <thead><tr id="contratti-thead-row"></tr></thead>
          <tbody id="contratti-tbody"></tbody>
        </table>
        <div id="contratti-empty" class="hidden">Nessun contratto salvato. Usa "+ Nuovo contratto" per iniziare.</div>
      </div>
    </div>
  </div>
</div>

<!-- ===== MODAL: SCHEDA CONTRATTO ===== -->
<div id="modal-contratto" class="modal-overlay hidden">
  <div class="modal">
    <span class="modal-close" data-close="modal-contratto">✕</span>
    <div class="title" id="modal-contratto-title">Scheda contratto</div>
    <div id="modal-contratto-fields"></div>
    <div class="modal-actions">
      <button class="btn small ghost hidden" id="btn-elimina-contratto">Elimina</button>
      <button class="btn small" id="btn-salva-contratto">Salva</button>
    </div>
  </div>
</div>

<!-- ===== MODAL: GESTISCI CAMPI ===== -->
<div id="modal-campi" class="modal-overlay hidden">
  <div class="modal">
    <span class="modal-close" data-close="modal-campi">✕</span>
    <div class="title">Gestisci campi tabella</div>
    <div id="campi-list"></div>
    <button class="btn small ghost" id="btn-aggiungi-campo" style="margin-top:10px;">+ Aggiungi campo</button>
    <div class="modal-actions">
      <span></span>
      <button class="btn small" id="btn-salva-campi">Salva campi</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
